@if (text) {
  <div class="bubble" [class.bubbleSender]="isSender">
    <app-subject color="transparent" lines="none" [subject]="creator"></app-subject>
    <div class="internalPSpacing" [innerHtml]="sanitizedHtml"></div>
  </div>
}
<ng-content></ng-content>
<!--skeleton-->
@if (!text) {
  <div class="bubble" [class.bubbleSender]="isSender">
    <ion-skeleton-text [animated]="true"></ion-skeleton-text>
  </div>
}
