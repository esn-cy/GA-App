<ion-header class="ion-no-border">
  <ion-toolbar color="light">
    <ion-buttons slot="start">
      <ion-button fill="clear" color="medium" (click)="close()">
        <ion-icon icon="close"></ion-icon>
      </ion-button>
    </ion-buttons>
    @if (reaction) {
      <ion-buttons slot="end">
        <ion-text [color]="color">{{ subjects?.length }}</ion-text>
        <ion-icon class="ion-padding-end" [icon]="icon" [color]="color"></ion-icon>
      </ion-buttons>
    }
  </ion-toolbar>
</ion-header>
<ion-content color="light">
  <ion-list class="aList">
    @if (showSpinner) {
      <p class="ion-text-center">
        <ion-spinner></ion-spinner>
      </p>
    }
    @for (subject of subjects; track subject.id) {
      <app-subject [subject]="subject" size="small"></app-subject>
    }
    @if (!showSpinner && !subjects?.length) {
      <ion-item class="noElements">
        <ion-label>{{ 'SUBJECTS.NO_ONE_REACTED_YET' | translate }}</ion-label>
      </ion-item>
    }
  </ion-list>
</ion-content>
