<ion-content [class.viewMode]="!editMode">
  <app-edit-mode-buttons
    [title]="'CATEGORIES.MANAGE_CATEGORY' | translate"
    [editMode]="!!editMode"
    (enter)="enterEditMode()"
    (exit)="exitEditMode()"
    (save)="save()"
  ></app-edit-mode-buttons>
  @if (category) {
    <ion-list class="aList maxWidthContainer" [lines]="editMode ? 'full': 'none'">
      <ion-item [class.fieldHasError]="hasFieldAnError('name')">
        <ion-input labelPlacement="stacked" [(ngModel)]="category.name" [disabled]="!editMode">
          <div slot="label">
            {{ 'CATEGORIES.NAME' | translate }}
            <ion-text class="obligatoryDot"></ion-text>
          </div>
        </ion-input>
      </ion-item>
      <ion-item [class.fieldHasError]="hasFieldAnError('color')">
        <ion-select interface="popover" labelPlacement="stacked" [(ngModel)]="category.color" [disabled]="!editMode">
          <div slot="label">
            {{ 'CATEGORIES.COLOR' | translate }}
            <ion-text class="obligatoryDot"></ion-text>
          </div>
          @for (color of colors; track color) {
            <ion-select-option>{{ color }}</ion-select-option>
          }
        </ion-select>
      </ion-item>
      @if (editMode === UXMode.EDIT) {
        <ion-row class="ion-padding-top">
          <ion-col>
            <ion-button color="warning" (click)="archiveCategory(!category.archivedAt)">
              {{ (category.archivedAt ? 'COMMON.UNARCHIVE' : 'COMMON.ARCHIVE') | translate }}
            </ion-button>
          </ion-col>
          <ion-col class="ion-text-right">
            <ion-button color="danger" (click)="deleteCategory()">{{ 'COMMON.DELETE' | translate }}</ion-button>
          </ion-col>
        </ion-row>
      }
    </ion-list>
  }
</ion-content>
