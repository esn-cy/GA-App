<ion-content [class.viewMode]="!editMode">
  <app-edit-mode-buttons
    [title]="'EVENTS.MANAGE_EVENT' | translate"
    [editMode]="!!editMode"
    (enter)="enterEditMode()"
    (exit)="exitEditMode()"
    (save)="save()"
  ></app-edit-mode-buttons>
  @if (event) {
    <ion-list class="aList maxWidthContainer" [lines]="editMode ? 'full': 'none'">
      <ion-item [class.fieldHasError]="hasFieldAnError('name')">
        <ion-input labelPlacement="stacked" [(ngModel)]="event.name" [disabled]="!editMode">
          <div slot="label">
            {{ 'EVENTS.NAME' | translate }}
            <ion-text class="obligatoryDot"></ion-text>
          </div>
        </ion-input>
      </ion-item>
      @if (editMode === UXMode.EDIT) {
        <ion-row class="ion-padding-top">
          <ion-col>
            <ion-button color="warning" (click)="archiveEvent(!event.archivedAt)">
              {{ (event.archivedAt ? 'COMMON.UNARCHIVE' : 'COMMON.ARCHIVE') | translate }}
            </ion-button>
          </ion-col>
          <ion-col class="ion-text-right">
            <ion-button color="danger" (click)="deleteEvent()">{{ 'COMMON.DELETE' | translate }}</ion-button>
          </ion-col>
        </ion-row>
      }
    </ion-list>
  }
</ion-content>
