<ion-header class="ion-no-border">
  @if (app.isInMobileMode()) {
    <ion-toolbar color="ideaToolbar">
      <ion-buttons slot="start">
        <ion-img [src]="app.getIcon(true)"></ion-img>
      </ion-buttons>
      <ion-title>{{ app.configurations.appTitle }}</ion-title>
    </ion-toolbar>
  }
  <ion-toolbar color="ideaToolbar">
    <ion-buttons slot="start">
      <ion-button (click)="app.goToInTabs(['configurations'], { back: true })">
        <ion-icon name="arrow-back" slot="end"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>{{ 'EVENTS.EVENTS' | translate }}</ion-title>
    <ion-buttons slot="end">
      <ion-button fill="solid" color="ESNcyan" (click)="addEvent()">{{ 'COMMON.ADD' | translate }}</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
<ion-content>
  <ion-list class="aList maxWidthContainer">
    @if (events && !events.length) {
      <ion-item lines="full" class="ion-text-center noElements">
        <ion-label>{{ 'COMMON.NO_ELEMENTS' | translate }}</ion-label>
      </ion-item>
    }
    @if (!events) {
      <ion-item>
        <ion-label>
          <ion-skeleton-text [animated]="true"></ion-skeleton-text>
        </ion-label>
      </ion-item>
    }
    @for (event of events; track event.eventId) {
      <ion-item [button]="true" (click)="openEvent(event)">
        <ion-label>{{ event.name }}</ion-label>
      </ion-item>
    }
    <ion-infinite-scroll (ionInfinite)="paginate($event?.target)">
      <ion-infinite-scroll-content></ion-infinite-scroll-content>
    </ion-infinite-scroll>
  </ion-list>
</ion-content>
